[project]
name = "smart-query"
version = "0.1.0"
description = "智能问数系统 v2（本期实现 L5/L4/L3/L2）"
requires-python = ">=3.10"
dependencies = [
    "sqlglot>=25.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/isolation_guard", "src/text2sql_pipeline", "src/query_engine"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
